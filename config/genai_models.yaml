benchmark_roster:
  # Keep prompts and decoding settings fixed across models where provider APIs allow it.
  decoding:
    temperature: 0
    max_output_tokens: 500
    response_format: json
  models:
    - supplier: OpenAI
      model: gpt-4o-mini
      task_role: selected_low_cost_labeler
    - supplier: OpenAI
      model: gpt-4.1-mini
      task_role: stronger_openai_baseline
    - supplier: Anthropic
      model: claude-sonnet-4.6
      task_role: stronger_anthropic_baseline
    - supplier: DeepSeek
      model: deepseek-chat
      task_role: low_cost_external_baseline
    - supplier: xAI
      model: grok-3-fast
      task_role: fast_external_baseline
    - supplier: xAI
      model: grok-4.1-fast
      task_role: newer_external_baseline

selection_strategy_candidates:
  - best_single_model_by_macro_f1
  - majority_vote_across_top_3_models
  - confidence_weighted_vote_if_available

metrics:
  classification:
    - macro_f1
    - per_class_f1
    - mcc
    - auc_ovr_when_probabilities_available
  reliability:
    - krippendorff_alpha_nominal
    - percent_agreement
  operations:
    - runtime_seconds
    - estimated_cost_usd
    - parse_failure_rate
